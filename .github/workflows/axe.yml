name: Lint for accessibility issues

on: [pull_request]

# Note: The axe-linter may have issues with Next.js route groups (directories with parentheses).
# If this causes problems, you may need to handle these files separately or use a different accessibility testing approach.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dequelabs/axe-linter-action@v1
        with:
          api_key: ${{ secrets.AXE_LINTER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
